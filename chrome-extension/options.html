<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Configuration Sellmaster Shopify</title>
  <style>
    body{max-width:680px;margin:50px auto;padding:0 22px;background:#f3f7f7;color:#183139;font:15px/1.5 system-ui,sans-serif}.card{background:#fff;border:1px solid #dce6e5;border-radius:14px;padding:26px;box-shadow:0 18px 45px #163a3d12}h1{font-size:24px;margin:0 0 8px}p{color:#62767a;margin:0 0 20px}label{display:block;margin:17px 0 6px;font-size:13px;font-weight:750}input{width:100%;height:44px;border:1px solid #cbd9d7;border-radius:8px;padding:0 11px;font:14px system-ui}button{margin-top:20px;border:0;border-radius:8px;background:#087f83;color:white;padding:12px 17px;font-weight:750;cursor:pointer}.status{font-size:13px;color:#13724b;margin-left:10px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Configuration du connecteur</h1>
    <p>Ces valeurs sont appliquées à l’application Shopify créée par l’assistant. Elles ne sont pas envoyées comme secrets à Shopify par l’extension.</p>
    <label for="app-url">App URL</label>
    <input id="app-url" type="url" placeholder="https://votre-app.example.com" autocomplete="url">
    <label for="redirect-uri">URL de redirection autorisée</label>
    <input id="redirect-uri" type="url" placeholder="https://sellmaster-1.onrender.com/api/shopify/auth/callback" autocomplete="url">
    <button id="save" type="button">Enregistrer</button><span id="status" class="status" role="status"></span>
  </main>
  <script src="options.js"></script>
</body>
</html>
