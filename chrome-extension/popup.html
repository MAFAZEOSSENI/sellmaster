<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sellmaster</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183139;background:#f3f7f7}*{box-sizing:border-box}body{width:330px;margin:0;padding:20px}.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#087f83;color:#fff}.sub{color:#66797d;font-size:12px;margin:3px 0 18px 38px}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input{width:100%;height:41px;border:1px solid #cedbd9;border-radius:8px;padding:0 10px;font:14px system-ui;background:#fff}button{width:100%;height:41px;border:0;border-radius:8px;background:#087f83;color:white;font-weight:750;margin-top:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:#e7f0ef;color:#175b5d}.message{min-height:18px;margin:10px 0 0;font-size:12px;color:#5c6f73}.error{color:#b42318}.success{color:#157347}.account{padding:11px;border:1px solid #dce6e5;border-radius:8px;background:white;font-size:13px}.small{margin-top:8px;color:#687b80;font-size:11px}
  </style>
</head>
<body>
  <div class="brand"><span class="mark">S</span><span>SELLMASTER</span></div>
  <div class="sub">Connecteur de boutique Shopify</div>
  <section id="login-view">
    <form id="login-form">
      <label for="email">E-mail Sellmaster</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-button" type="submit">Se connecter</button>
    </form>
  </section>
  <section id="account-view" hidden>
    <div class="account">Connecté en tant que <strong id="account-email"></strong></div>
    <div class="small">Ouvre l’administration Shopify et utilise le panneau Sellmaster.</div>
    <button id="logout" class="secondary" type="button">Se déconnecter</button>
  </section>
  <p id="message" class="message" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
