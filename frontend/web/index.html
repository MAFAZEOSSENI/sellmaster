<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="679713157139-e8r3ahd7milpcuvng9vfiruiijcghm12.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.googleWebSignIn = function () {
      return new Promise((resolve, reject) => {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          reject(new Error('Google Identity Services indisponible. Rechargez la page.'));
          return;
        }

        window.google.accounts.id.initialize({
          client_id: '679713157139-e8r3ahd7milpcuvng9vfiruiijcghm12.apps.googleusercontent.com',
          callback: (response) => {
            if (response && response.credential) {
              resolve(response.credential);
            } else {
              reject(new Error('Google n’a pas renvoyé d’identifiant de session valide.'));
            }
          }
        });

        window.google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            reject(new Error('La popup Google n’a pas pu s’afficher. Vérifiez les paramètres du navigateur et la configuration OAuth Google.'));
          }
        });
      });
    };
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gestion_commandes_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gestion_commandes_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
